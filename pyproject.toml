[project]
name = "crypto-alert-api"
version = "0.1.0"
description = "CryptoAlert API"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.27.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "redis[hiredis]>=7.4.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.46.0",
    "websockets>=16.0",
    "ruff>=0.15.12",
    "pyright>=1.1.409",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres,redis]>=4.14.2",
]

[tool.ruff]
line-length = 88
exclude = [
    "src/migrations",
    ".venv",
]

[tool.ruff.lint]
select = [
    "I",
    "F",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2

[tool.pyright]
include = [
    "src",
]